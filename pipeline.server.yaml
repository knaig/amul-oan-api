# Planner-lab pipeline for a SERVER next to your models (the 2-3 s configuration).
# Fill the endpoints; api_key_env NAMES an env var, never a value.
#   - agent / moderation / suggestions: keep the managed model you trust, or move to vLLM.
#   - pre_translation: on-prem gemma via vLLM (saves ~0.5-0.8 s per turn vs OpenAI over the internet).
#   - post_translation: TranslateGemma LB (saves ~3 s to the last word vs OpenAI).
fallback_enabled: true

profiles:
  - name: gpt41
    weight: 100
    capabilities: {history_max_tokens: 80000}
    steps:
      agent:           {tiers: [{provider: openai, admission: managed, model: gpt-4.1, api_key_env: OPENAI_API_KEY, timeout_ms: 60000, label: gpt41-agent}]}
      moderation:      {tiers: [{provider: vllm, model: gemma-4-31b-it, endpoint: ${GEMMA_VLLM_URL}, api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 5000, label: gemma-moderation},
                                {provider: openai, admission: managed, model: gpt-4.1-mini, api_key_env: OPENAI_API_KEY, timeout_ms: 20000, label: managed-fallback}]}
      suggestions:     {tiers: [{provider: vllm, model: gemma-4-31b-it, endpoint: ${GEMMA_VLLM_URL}, api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 6000, label: gemma-suggestions}]}
      pre_translation: {tiers: [{provider: vllm, model: gemma-4-31b-it, endpoint: ${GEMMA_VLLM_URL}, api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 10000, label: gemma-pretranslation},
                                {provider: openai, admission: managed, model: gpt-4.1-mini, api_key_env: OPENAI_API_KEY, timeout_ms: 20000, label: managed-pretranslation}]}

  - name: gemma_all     # everything on-prem
    weight: 0
    capabilities: {history_max_tokens: 10000}
    steps:
      agent:           {tiers: [{provider: vllm, model: gemma-4-31b-it, endpoint: ${GEMMA_VLLM_URL}, api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 8000, label: gemma-agent},
                                {provider: openai, admission: managed, model: gpt-4.1, api_key_env: OPENAI_API_KEY, timeout_ms: 60000, label: managed-fallback}]}
      moderation:      {tiers: [{provider: vllm, model: gemma-4-31b-it, endpoint: ${GEMMA_VLLM_URL}, api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 5000, label: gemma-moderation}]}
      suggestions:     {tiers: [{provider: vllm, model: gemma-4-31b-it, endpoint: ${GEMMA_VLLM_URL}, api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 6000, label: gemma-suggestions}]}
      pre_translation: {tiers: [{provider: vllm, model: gemma-4-31b-it, endpoint: ${GEMMA_VLLM_URL}, api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 10000, label: gemma-pretranslation}]}

defaults:
  post_translation:
    tiers:
      - {provider: translategemma, model: translategemma-27b-base, endpoint: ${TRANSLATEGEMMA_URL}, timeout_ms: 60000, ttft_ms: 5000, label: translategemma}
      - {provider: openai, admission: managed, model: gpt-4.1-mini, api_key_env: OPENAI_API_KEY, timeout_ms: 30000, label: llm-fallback}
